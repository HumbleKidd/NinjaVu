<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NinjaVu offline</title>
<style>
  body{margin:0;font-family:sans-serif;background:#F7F4EC;color:#10221A;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:28px}
  .card{max-width:420px}
  h1{font-size:28px;margin:0 0 8px}
  p{color:#3d5348;line-height:1.45}
  button{margin-top:16px;border:0;background:#0F9F6E;color:white;font-weight:700;font-size:16px;padding:12px 22px;border-radius:999px}
  button:focus{outline:3px solid #10221A;outline-offset:3px}
</style>
</head>
<body>
  <div class="card">
    <h1>NinjaVu</h1>
    <p>The catalogue did not load. Check the connection, then press OK on Retry. If the domain moved, open the gateway from the more menu.</p>
    <button id="retry" autofocus onclick="if(window.NinjaVuKeys)NinjaVuKeys.retry();else location.reload()">Retry</button>
  </div>
</body>
</html>
